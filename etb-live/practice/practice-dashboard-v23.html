<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Homework dashboard</title>
<style>
:root{--navy:#183d61;--teal:#147b91;--ink:#17324d;--muted:#678096;--line:#d5e1e8;--green:#258452}
*{box-sizing:border-box}body{margin:0;background:#f4f6f7;color:var(--ink);font:12px/1.25 Arial,sans-serif}
.dashboard{padding:6px 8px 18px}.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:5px}.top h1{margin:0;flex:1;min-width:0;max-width:none;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;line-height:1.2;font-weight:800;color:var(--navy)}
.status{flex:0 0 145px;min-width:145px;padding:7px 10px;border-radius:999px;background:#edf1f4;color:#607586;font-size:13px;font-weight:800;text-align:center;line-height:1.05;white-space:nowrap}.status small{display:block;font-size:10px;margin-top:3px;font-weight:600}.status.ready{background:#e8f3ec;color:#17663d}
.instructions{border:1px solid #b9d5df;border-left:3px solid var(--teal);border-radius:7px;background:#eef6f8;padding:5px 7px;margin:0 0 8px;color:var(--ink);font-size:11px;line-height:1.2}.instructions strong{font-size:11px}.instructions ol{margin:3px 0 0 14px;padding:0}.instructions li{padding:0}
.heading{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:0 0 5px}.heading h2{margin:0;color:var(--navy);font-size:18px}.heading span{color:var(--muted);font-size:13px}
.concept-list{display:grid;grid-template-columns:1fr;gap:5px}.concept{background:#fff;border:1px solid var(--line);border-radius:8px;padding:7px 8px 6px;box-shadow:0 2px 7px #183d6110}.concept-head{margin-bottom:5px}.concept-head h3{margin:0;color:var(--navy);font-size:12px;line-height:1.05}.concept-state{display:block;margin-top:4px;color:#63809a;font-size:10px;font-weight:800;letter-spacing:.04em}.concept.done{border-color:#9ccdad}.concept.done .concept-state{color:var(--green)}
.tier{margin-top:5px}.tier-name{display:flex;justify-content:space-between;gap:5px;color:var(--navy);font-size:11px;font-weight:700}.tier-name span:last-child{font-weight:400;color:#55728b}.tier-bar{height:5px;margin-top:3px;background:#e4ecef;border-radius:20px;overflow:hidden}.tier-bar span{display:block;height:100%;background:#7da6b5;border-radius:inherit}.tier:nth-child(2) .tier-bar span{background:#d58a23}.tier:nth-child(3) .tier-bar span{background:#8b62b5}.tier.complete .tier-bar span{background:var(--green)}.tier-note{margin-top:2px;color:#587792;font-size:9px}.empty{padding:14px;text-align:center;color:var(--muted);background:#fff;border:1px dashed var(--line);border-radius:12px}
@media(max-width:560px){.top{align-items:center}.top h1{font-size:15px;line-height:1.2;max-width:none}.status{font-size:14px;padding:8px 10px}.concept-list{grid-template-columns:1fr}.concept-head h3{font-size:14px}}
</style>
<style>
.dashboard-tabs{display:flex;gap:4px;margin:0 0 8px;border-bottom:1px solid var(--line)}
.dashboard-tabs button{flex:1 1 0;border:0;border-bottom:2px solid transparent;background:transparent;color:var(--muted);font:700 11px/1.1 Arial,sans-serif;padding:6px 4px;cursor:pointer}
.dashboard-tabs button[aria-selected="true"]{color:var(--navy);border-bottom-color:var(--teal);background:#eef6f8}
.dashboard-scope-note{margin:0 0 7px;color:var(--muted);font-size:10px}
.aggregate-label{font-size:10px;color:var(--muted);font-weight:400;margin-top:2px}
.concept.needs-work{border-left:3px solid var(--ribbon)}.summary-chapter{border-left:3px solid var(--ribbon)}
</style>
<style>
.dashboard[data-scope="chapter"]{--ribbon:#78cfd0}
.dashboard[data-scope="unit"]{--ribbon:#2f8f62}
.dashboard[data-scope="textbook"]{--ribbon:#17613e}
.dashboard .tier-bar span,.dashboard .summary-bar span{background:var(--ribbon)!important}
.summary-chapter{background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 9px;box-shadow:0 2px 7px #183d6110}
.summary-chapter+.summary-chapter{margin-top:6px}
.summary-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;color:var(--navy)}
.summary-head h3{margin:0;font-size:13px;line-height:1.15}
.summary-percent{font-size:12px;color:var(--muted);white-space:nowrap}
.summary-bar{height:7px;margin-top:5px;background:#e4ecef;border-radius:20px;overflow:hidden}
.summary-bar span{display:block;height:100%;border-radius:inherit}
.concept-summary-list{display:grid;grid-template-columns:1fr 1fr;gap:4px 8px;margin-top:7px;padding-top:6px;border-top:1px solid #edf2f4}
.concept-summary{min-width:0}
.concept-summary-name{display:flex;justify-content:space-between;gap:4px;color:var(--navy);font-size:10px;line-height:1.15}
.concept-summary-name span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.concept-summary-name span:last-child{color:var(--muted);white-space:nowrap}
@media(max-width:560px){.concept-summary-list{grid-template-columns:1fr}.summary-head h3{font-size:14px}}
</style><body>
<main class="dashboard" id="dashboard-root" data-scope="chapter">
<header class="top"><h1 id="dashboard-title">Market Failures I: Externalities</h1><div class="status" id="overall-status">Readiness Check<small id="readiness-status">Incomplete</small></div></header>
<nav class="dashboard-tabs" aria-label="Homework dashboard scope">
<button type="button" data-scope="chapter" aria-selected="true">Chapter Dashboard</button>
<button type="button" data-scope="unit" aria-selected="false">Unit Dashboard</button>
<button type="button" data-scope="textbook" aria-selected="false">Textbook Dashboard</button>
</nav>
<p class="dashboard-scope-note" id="scope-note">Progress for this chapter’s current concept practices.</p>
<div class="heading"><h2 id="concept-heading">Major concepts</h2><span id="concept-count"></span></div>
<section class="concept-list" id="concept-list"><div class="empty">Loading current textbook practice…</div></section>
</main>
<script>
(function(){
"use strict";
var p=new URLSearchParams(location.search);
var cfg={bankId:p.get("bank")||"econ-150-ch17",storageKey:p.get("storage")||"pp:econ-150-ch17:1",bankUrl:p.get("bankUrl")||"banks/econ-150-ch17.js"};
var pass={1:8,2:4,3:2},goals={1:10,2:5,3:3},scope="chapter",bankCache={};
var catalog=[
{id:"econ-150-ch15",label:"Chapter 15: Elasticity",unit:"Unit 3 · The Critique of the Market",url:"banks/econ-150-ch15.js"},
{id:"econ-150-ch16",label:"Chapter 16: Institutions",unit:"Unit 3 · The Critique of the Market",url:"banks/econ-150-ch16.js"},
{id:"econ-150-ch17",label:"Chapter 17: Market Failures I: Externalities",unit:"Unit 3 · The Critique of the Market",url:"banks/econ-150-ch17.js"},
{id:"econ-150-ch18",label:"Chapter 18: Market Failures II: The Tragedy of the Commons",unit:"Unit 3 · The Critique of the Market",url:"banks/econ-150-ch18.js"},
{id:"econ-150-ch19",label:"Chapter 19: Market Failures III: Taxes, Subsidies, and Incentives",unit:"Unit 3 · The Critique of the Market",url:"banks/econ-150-ch19.js"}
];
var currentSpec={id:cfg.bankId,label:"Chapter 17: Market Failures I: Externalities",unit:"Unit 3 · The Critique of the Market",url:cfg.bankUrl,storageKey:cfg.storageKey};
catalog=catalog.filter(function(s){return s.id!==currentSpec.id}).concat([currentSpec]);
function esc(v){return String(v==null?"":v).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function read(key){try{return JSON.parse(localStorage.getItem(key)||"{}")}catch(e){return{}}}
function loadBank(spec){
 if(window.PP_BANKS&&window.PP_BANKS[spec.id])return Promise.resolve(window.PP_BANKS[spec.id]);
 if(bankCache[spec.id])return bankCache[spec.id];
 bankCache[spec.id]=new Promise(function(resolve){
  var s=document.createElement("script");s.src=spec.url+"?v=chapter17-summary-dashboard";s.onload=function(){resolve(window.PP_BANKS&&window.PP_BANKS[spec.id]||null)};s.onerror=function(){resolve(null)};document.head.appendChild(s);
 });
 return bankCache[spec.id];
}
function tiersFor(c){return[1,2,3].filter(function(t){return(c.activities||[]).some(function(a){return Number(a.tier)===t})})}
function tier(cs,t){var c=Number(cs&&cs.correct&&cs.correct[t]||0);return{correct:c,goal:goals[t],pass:pass[t],pct:Math.min(100,Math.round(c/goals[t]*100)),complete:c>=pass[t]}}
function conceptProgress(spec,c){
 var S=read(spec.storageKey||("pp:"+spec.id+":1")),cs=S.concepts&&S.concepts[c.id]||{},ts=tiersFor(c),earned=0,total=0;
 ts.forEach(function(t){var x=tier(cs,t);earned+=Math.min(x.correct,x.pass);total+=x.pass});
 return{pct:total?Math.round(earned/total*100):0,tiers:ts};
}
function detailCard(spec,c){
 var S=read(spec.storageKey||("pp:"+spec.id+":1")),cs=S.concepts&&S.concepts[c.id]||{},ts=tiersFor(c),d=ts.map(function(t){return tier(cs,t)}),all=d.length>0&&d.every(function(x){return x.complete});
 return{all:all,html:'<article class="concept '+(all?"done":"needs-work")+'"><div class="concept-head"><h3>Concept '+esc(c.number)+': '+esc(c.name)+'</h3><span class="concept-state">'+(all?"COMPLETE":"IN PROGRESS")+'</span></div>'+d.map(function(x,i){return'<div class="tier '+(x.complete?"complete":"")+'"><div class="tier-name"><span>Tier '+ts[i]+'</span><span>'+x.correct+'/'+x.goal+' correct</span></div><div class="tier-bar"><span style="width:'+x.pct+'%"></span></div><div class="tier-note">'+(x.complete?"Requirement met: "+x.pass+"/"+x.goal+" needed":"Need "+x.pass+"/"+x.goal+" to move on")+'</div></div>'}).join("")+'</article>'};
}
function chapterSummary(spec,bank,showConcepts){
 var concepts=bank.concepts||[],total=0,earned=0;
 concepts.forEach(function(c){var q=conceptProgress(spec,c);earned+=q.pct;total+=100});
 var pct=concepts.length?Math.round(earned/total*100):0;
 var html='<article class="summary-chapter"><div class="summary-head"><h3>'+esc(spec.label)+'</h3><span class="summary-percent">'+pct+'% complete</span></div><div class="summary-bar"><span style="width:'+pct+'%"></span></div>';
 if(showConcepts){
  html+='<div class="concept-summary-list">'+concepts.map(function(c){var q=conceptProgress(spec,c);return'<div class="concept-summary"><div class="concept-summary-name"><span>'+esc(c.name)+'</span><span>'+q.pct+'%</span></div><div class="summary-bar"><span style="width:'+q.pct+'%"></span></div></div>'}).join("")+'</div>';
 }
 return{pct:pct,html:html+'</article>'};
}
function specsFor(){if(scope==="chapter")return[currentSpec];if(scope==="unit")return catalog.filter(function(s){return s.unit===currentSpec.unit});return catalog}
function render(){
 var root=document.getElementById("dashboard-root"),list=document.getElementById("concept-list"),specs=specsFor(),aggregate=scope!=="chapter";
 root.setAttribute("data-scope",scope);list.innerHTML='<div class="empty">Loading progress…</div>';
 Promise.all(specs.map(function(s){return loadBank(s).then(function(b){return{spec:s,bank:b}})})).then(function(items){
  var total=0,complete=0,loaded=0,html=[];
  if(scope==="chapter"){
   var item=items[0];
   if(item.bank&&item.bank.concepts){loaded=1;item.bank.concepts.forEach(function(c){var x=detailCard(item.spec,c);html.push(x.html);total++;if(x.all)complete++})}
  }else{
   items.forEach(function(item){if(!item.bank||!item.bank.concepts)return;loaded++;var x=chapterSummary(item.spec,item.bank,scope==="unit");html.push(x.html);total++;if(x.pct>=100)complete++});
  }
  list.innerHTML=html.length?html.join(""):'<div class="empty">No current practice data could be loaded for this view.</div>';
  var title=document.getElementById("dashboard-title"),heading=document.getElementById("concept-heading"),note=document.getElementById("scope-note");
  if(scope==="chapter"){title.textContent=currentSpec.label.replace(/^Chapter 17: /,"");heading.textContent="Major concepts";note.textContent="Detailed tier progress for this chapter.";document.getElementById("concept-count").textContent=total+" concepts"}
  else if(scope==="unit"){title.textContent="Unit Dashboard";heading.textContent="Chapter concepts";note.textContent=currentSpec.unit+" · overall progress by concept.";document.getElementById("concept-count").textContent=total+" chapters"}
  else{title.textContent="Textbook Dashboard";heading.textContent="Chapter progress";note.textContent="Overall progress for each chapter with current practice data.";document.getElementById("concept-count").textContent=total+" chapters"}
  var status=document.getElementById("overall-status"),rs=document.getElementById("readiness-status");status.classList.toggle("ready",total>0&&complete===total);rs.textContent=total>0&&complete===total?"Complete":(complete+" of "+total+" complete");
 });
}
document.querySelectorAll("[data-scope]").forEach(function(b){b.onclick=function(){scope=b.getAttribute("data-scope");document.querySelectorAll("[data-scope]").forEach(function(x){x.setAttribute("aria-selected",String(x===b))});render()}});
render();window.setInterval(render,1500);
})();
</script>
</body>
</html>
